<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>drebol-funp — заказы</title>
<link rel="icon" href="/favicon.ico">
<link rel="apple-touch-icon" href="/favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=Unbounded:wght@500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="app-page">
  <div class="bg">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="grid"></div>
    <div class="noise"></div>
  </div>

  <header class="topbar">
    <div class="logo small">
      <span class="logo-mark">DF</span>
      <h1>drebol<span>funp</span></h1>
    </div>
    <nav class="nav">
      <a href="/">Панель</a>
      <a href="/profit">Прибыль</a>
      <a href="/orders" class="active">Заказы</a>
      <a href="/pricing">Мин. цены</a>
      <a href="/calc">Калькулятор</a>
      <a href="/settings">Настройки</a>
    </nav>
    <div class="topbar-right">
      <span class="user" id="user">admin</span>
      <button class="ghost" id="logout">Выйти</button>
    </div>
  </header>

  <main class="content wide">
    <section class="panel" style="--i:1">
      <div class="panel-head">
        <div>
          <h2>Заказы</h2>
          <p class="muted">Продажи с FunPay: свежие — по 100 за раз, из базы — все сразу. Прибыль считается по ценам закупа из «Мин. цен». Если у товара две цены — выбери в заказе, с кэшбеком или без.</p>
        </div>
        <div class="orders-sum">
          <span class="pill" id="cntPill">загружено 0</span>
          <span class="pill" id="sumPill" hidden>на сумму —</span>
          <span class="pill" id="profitPill" hidden>прибыль —</span>
        </div>
      </div>

      <div class="orders-tools">
        <input type="search" id="filter" class="search" placeholder="Поиск по загруженным: товар, покупатель, № заказа">
        <select id="sort" class="select">
          <option value="new">Сначала новые</option>
          <option value="old">Сначала старые</option>
          <option value="profit_desc">Прибыль: больше</option>
          <option value="profit_asc">Прибыль: меньше</option>
          <option value="price_desc">Сумма: больше</option>
        </select>
        <button class="btn ghost-btn" id="reloadBtn"><span class="label">Обновить</span><span class="spinner"></span></button>
      </div>

      <div class="order-filters">
        <div class="chips small" id="srcChips">
          <button data-src="live">С FunPay · по 100</button>
          <button data-src="cache">Из базы · все сразу</button>
        </div>
        <div class="chips small" id="statusChips">
          <button data-st="all">Все</button>
          <button data-st="paid">Оплачены</button>
          <button data-st="closed">Закрыты</button>
          <button data-st="refund">Возвраты</button>
        </div>
        <div class="chips small" id="costChips">
          <button data-cf="all">Любой закуп</button>
          <button data-cf="undecided">Выбрать кэшбек</button>
          <button data-cf="nocost">Без закупа</button>
          <button data-cf="loss">В минус</button>
          <button data-cf="manual">Закуп вручную</button>
          <button data-cf="cashback">С кэшбеком</button>
        </div>
      </div>

      <div class="bulk-choice" id="bulkChoice" hidden>
        <span id="bulkInfo">—</span>
        <button class="btn ghost-btn" data-bulk="cashback"><span class="label">Всем — с кэшбеком</span><span class="spinner"></span></button>
        <button class="btn ghost-btn" data-bulk="plain"><span class="label">Всем — без кэшбека</span><span class="spinner"></span></button>
      </div>

      <div class="orders" id="list"></div>

      <div class="orders-empty" id="empty" hidden></div>

      <div class="orders-foot">
        <button class="btn primary" id="moreBtn" hidden><span class="label">Загрузить ещё 100</span><span class="spinner"></span></button>
        <p class="tip" id="footHint"></p>
      </div>
    </section>
  </main>

  <div class="toast" id="toast"></div>
  <script src="/static/js/orders.js"></script>
  <script src="/static/js/brand.js"></script>
  <script src="/static/js/fx.js"></script>
</body>
</html>
