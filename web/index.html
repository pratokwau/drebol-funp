<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>drebol-funp — вход</title>
<link rel="icon" href="/favicon.ico">
<link rel="apple-touch-icon" href="/favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="auth-page">
  <div class="bg">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
    <div class="grid"></div>
    <div class="noise"></div>
  </div>

  <main class="card" id="card">
    <div class="card-glow"></div>

    <div class="logo">
      <span class="logo-mark">DF</span>
      <div class="logo-text">
        <h1>drebol<span>funp</span></h1>
        <p>панель управления</p>
      </div>
    </div>

    <form id="loginForm" autocomplete="off" novalidate>
      <div class="field" style="--i:1">
        <input type="text" id="login" name="login" placeholder=" " autocomplete="username" required>
        <label for="login">Логин</label>
        <span class="bar"></span>
      </div>

      <div class="field" style="--i:2">
        <input type="password" id="password" name="password" placeholder=" " autocomplete="current-password" required>
        <label for="password">Пароль</label>
        <span class="bar"></span>
        <button type="button" class="eye" id="eye" aria-label="Показать пароль">
          <svg viewBox="0 0 24 24"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
      </div>

      <div class="error" id="error"></div>

      <button type="submit" class="submit" id="submit" style="--i:3">
        <span class="label">Войти</span>
        <span class="spinner"></span>
      </button>
    </form>

    <p class="hint" style="--i:4">Пароль выводится в консоль сервера при старте сайта</p>
  </main>

  <script src="/static/js/login.js"></script>
  <script src="/static/js/brand.js"></script>
</body>
</html>
