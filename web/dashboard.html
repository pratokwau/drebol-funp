<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>drebol-funp — панель</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="app-page">
  <div class="bg">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="grid"></div>
    <div class="noise"></div>
  </div>

  <header class="topbar">
    <div class="logo small">
      <span class="logo-mark">DF</span>
      <h1>drebol<span>funp</span></h1>
    </div>
    <div class="topbar-right">
      <span class="user" id="user">admin</span>
      <button class="ghost" id="logout">Выйти</button>
    </div>
  </header>

  <main class="content">
    <section class="panel" style="--i:1">
      <h2>Панель готова</h2>
      <p>Сайт установлен и работает. Модули FunPay подключаем дальше.</p>
    </section>

    <div class="tiles">
      <div class="tile" style="--i:2"><h3>Аккаунт FunPay</h3><p class="muted">не подключён</p></div>
      <div class="tile" style="--i:3"><h3>Лоты</h3><p class="muted">—</p></div>
      <div class="tile" style="--i:4"><h3>Заказы</h3><p class="muted">—</p></div>
      <div class="tile" style="--i:5"><h3>Автовыдача</h3><p class="muted">выключена</p></div>
    </div>
  </main>

  <script src="/static/js/app.js"></script>
</body>
</html>
